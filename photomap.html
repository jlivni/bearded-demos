<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photomap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js" onerror="void 0"></script>
  <style>
    html, body, #map { margin: 0; padding: 0; height: 100%; }
    #controls {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,.92); padding: 8px; border-radius: 4px;
      font: 14px sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    #controls select, #controls button { font-size: 14px; margin: 2px 0; }
    #status { color: #666; font-size: 12px; margin-top: 4px; max-width: 180px; }
    .photo-icon { border: 2px solid #fff; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.6);
      background-size: cover; background-position: center; }
    .leaflet-popup-content img { max-width: 240px; display: block; }
    .leaflet-popup-content small { color: #666; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="controls">
    <select id="provider">
      <option value="flickr">Flickr</option>
      <option value="commons">Wikimedia Commons</option>
    </select>
    <select id="sort">
      <option value="interestingness-desc">Interesting</option>
      <option value="date-posted-desc">Newest</option>
    </select>
    <div id="status"></div>
  </div>
<script>
var FLICKR_KEY = window.FLICKR_KEY;

var map = L.map('map').setView([39.1, -120.1], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);

var layer = L.layerGroup().addTo(map);
var seq = 0;

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];
  });
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// Each provider resolves to [{lat, lng, thumb, title, owner, url}]
var providers = {
  flickr: function(bounds, sort) {
    if (!FLICKR_KEY) return Promise.reject(new Error('no Flickr key (config.js missing)'));
    var p = new URLSearchParams({
      method: 'flickr.photos.search',
      api_key: FLICKR_KEY,
      bbox: [bounds.getWest(), bounds.getSouth(), bounds.getEast(), bounds.getNorth()].join(','),
      has_geo: 1,
      per_page: 100,
      sort: sort,
      extras: 'geo,url_s,owner_name',
      format: 'json',
      nojsoncallback: 1
    });
    return fetch('https://www.flickr.com/services/rest/?' + p).then(function(r) { return r.json(); })
      .then(function(d) {
        if (d.stat === 'fail') throw new Error(d.message);
        return d.photos.photo.filter(function(x) { return x.url_s; }).map(function(x) {
          return {
            lat: +x.latitude, lng: +x.longitude, thumb: x.url_s, title: x.title, owner: x.ownername,
            url: 'https://www.flickr.com/photos/' + x.owner + '/' + x.id
          };
        });
      });
  },

  // Commons geosearch caps radius at 10km, so only works zoomed in
  commons: function(bounds) {
    var c = bounds.getCenter();
    var radius = Math.min(10000, Math.max(10, c.distanceTo(bounds.getNorthEast())));
    var p = new URLSearchParams({
      action: 'query', generator: 'geosearch', ggsnamespace: 6, ggsprimary: 'all',
      ggscoord: c.lat + '|' + c.lng, ggsradius: Math.round(radius), ggslimit: 50, // imageinfo with thumbnails is capped at 50 per request
      prop: 'coordinates|imageinfo', colimit: 'max', iiprop: 'url', iiurlwidth: 240,
      format: 'json', origin: '*'
    });
    return fetch('https://commons.wikimedia.org/w/api.php?' + p).then(function(r) { return r.json(); })
      .then(function(d) {
        var pages = (d.query && d.query.pages) || {};
        return Object.keys(pages).map(function(k) { return pages[k]; })
          .filter(function(x) { return x.coordinates && x.imageinfo; })
          .map(function(x) {
            return {
              lat: x.coordinates[0].lat, lng: x.coordinates[0].lon,
              thumb: x.imageinfo[0].thumburl, title: x.title.replace(/^File:/, ''), owner: 'Wikimedia Commons',
              url: x.imageinfo[0].descriptionurl
            };
          });
      });
  }
};

function load() {
  var id = ++seq;
  var provider = document.getElementById('provider').value;
  var sort = document.getElementById('sort').value;
  if (provider === 'commons' && map.getZoom() < 11) {
    layer.clearLayers();
    setStatus('Zoom in to load Commons photos');
    return;
  }
  setStatus('Loading…');
  providers[provider](map.getBounds(), sort).then(function(photos) {
    if (id !== seq) return; // a newer request superseded this one
    layer.clearLayers();
    photos.forEach(function(ph) {
      var icon = L.divIcon({
        className: 'photo-icon',
        html: '', iconSize: [40, 40]
      });
      var m = L.marker([ph.lat, ph.lng], { icon: icon }).addTo(layer);
      m.getElement().style.backgroundImage = 'url("' + ph.thumb + '")';
      m.bindPopup(
        '<a href="' + esc(ph.url) + '" target="_blank" rel="noopener"><img src="' + esc(ph.thumb) + '"></a>' +
        '<b>' + esc(ph.title) + '</b><br><small>' + esc(ph.owner) + '</small>'
      );
    });
    setStatus(photos.length + ' photos');
  }).catch(function(e) {
    if (id !== seq) return;
    setStatus('Error: ' + e.message);
  });
}

var timer;
function loadSoon() { clearTimeout(timer); timer = setTimeout(load, 400); }

map.on('moveend', loadSoon);
document.getElementById('provider').addEventListener('change', load);
document.getElementById('sort').addEventListener('change', load);
load();
</script>
</body>
</html>
