<!DOCTYPE html>
<html>
  <head>
    <title>Photomap</title>
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta charset="utf-8">
    <style>
      html, body, #map-canvas {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      input[type=text] {
        margin: 10px;
        height: 28px;
        border: 0px;
        font-size:1.0em;
        padding-left: 10px;
      }
      select {
        font-size:1.0em;
        color: #444;
        margin: 10px;
        width: 140px;
        height: 34px;
        overflow: hidden;
        border: 1px solid #ccc;
      }
      #copyright {
        opacity:.8;
        background:white;
        padding:1px 3px 1px 3px;
        color: #444;
      }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="config.js"></script>
    <script>
      // Maps key comes from config.js (gitignored)
      document.write('<script src="https://maps.googleapis.com/maps/api/js?v=weekly&libraries=places&key=' + window.GMAPS_KEY + '"><\/script>');
    </script>
    <script>


function CoordMapType(tileSize) {
  this.tileSize = tileSize;
}

CoordMapType.prototype.getTile = function(coord, zoom, ownerDocument) {
  var bounds = getTileBounds(coord, zoom);
  var sw = bounds.getSouthWest();
  var ne = bounds.getNorthEast();
  var img = $('<div/>', {
    id: [coord.x, coord.y, zoom].join('_')
  }).css({width: 256, height: 256, backgroundSize: 'cover', backgroundPosition: 'center'});

  $.getJSON('https://www.flickr.com/services/rest/', {
    method: 'flickr.photos.search',
    api_key: window.FLICKR_KEY,
    bbox: [sw.lng(), sw.lat(), ne.lng(), ne.lat()].join(','),
    has_geo: 1,
    sort: 'interestingness-desc',
    per_page: 10,
    extras: 'url_m',
    format: 'json',
    nojsoncallback: 1
  }, function(response) {
    var photos = ((response.photos || {}).photo || []).filter(function(p) { return p.url_m; });
    if (!photos.length) return;
    var imgUrl = photos[Math.floor(Math.random() * photos.length)].url_m; // random of the most interesting
    // preload so the tile doesn't flash empty
    $('<img/>').attr('src', imgUrl).on('load', function() {
      img.css('backgroundImage', 'url(' + imgUrl + ')');
    });
  });
  return img[0];
};

getTileBounds = function(coord, zoom) {
  var proj = map.getProjection();
  var tileSize = 256 / Math.pow(2, zoom);
  var tileBounds = new google.maps.LatLngBounds(
    proj.fromPointToLatLng(new google.maps.Point(coord.x * tileSize, (coord.y + 1) * tileSize)),
    proj.fromPointToLatLng(new google.maps.Point((coord.x + 1) * tileSize, coord.y * tileSize))
  );
  return tileBounds;
};

var baseStyle = [
  {
    "stylers": [
      { "color": "#1d8080" },
      { "visibility": "off" }
    ]
  },{
    "featureType": "water",
    "stylers": [
      { "visibility": "on" },
      { "color": "#808080" }
    ]
  }
]



var overlayStyle = [
  {
    'stylers': [
      { 'visibility': 'off' }
    ]
  },{
    'featureType': 'water',
    'elementType': 'geometry',
    'stylers': [
      { 'visibility': 'simplified' }
    ]
  },{
    'featureType': 'road.arterial',
    'stylers': [
      { 'visibility': 'simplified' }
    ]
  },{
    'featureType': 'road.highway',
    'stylers': [
      { 'visibility': 'simplified' }
    ]
  },{
    "featureType": "administrative",
    "elementType": "labels.text.stroke",
    "stylers": [
      { "visibility": "on" },
      { "lightness": 44 }
    ]
  },{
    "featureType": "administrative",
    "elementType": "labels.text.fill",
    "stylers": [
      { "lightness": -66 },
      { "visibility": "on" }
    ]
  }
];

var map, photoMap;

function initialize() {
  var mapOptions = {
    zoom: 7,
    center: new google.maps.LatLng(48, -122),
    mapTypeControl: false,
    styles: baseStyle
  };
  map = new google.maps.Map(document.getElementById('map-canvas'),
      mapOptions);

  photoMap = new CoordMapType(new google.maps.Size(256, 256));
  map.overlayMapTypes.insertAt(0, photoMap);

  var styledMap = new google.maps.StyledMapType(overlayStyle);

  map.overlayMapTypes.insertAt(1, styledMap);

  // autocomplete
  var input = document.getElementById('searchTextField');
  map.controls[google.maps.ControlPosition.TOP_RIGHT].push(input);
  var autocomplete = new google.maps.places.Autocomplete(input);

  autocomplete.bindTo('bounds', map);
  google.maps.event.addListener(autocomplete, 'place_changed', function() {
    var place = autocomplete.getPlace();
    if (place.geometry.viewport) {
      map.fitBounds(place.geometry.viewport);
    } else {
      map.setCenter(place.geometry.location);
      map.setZoom(17);  // Why 17? Because it looks good.
    }
  });

  // copyright
  $('#copyright').text('Photos from Flickr, copyright of their owners');
  map.controls[google.maps.ControlPosition.BOTTOM_RIGHT].push($('#copyright')[0]);
}

google.maps.event.addDomListener(window, 'load', initialize);

    </script>
  </head>
  <body>
    <div id="map-canvas"></div>
    <div id="copyright"></div>
    <input id="searchTextField" type="text" size="50">
  </body>
</html>
