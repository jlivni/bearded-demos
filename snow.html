<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNOW</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  <style>
    body {
      background-color: #f5f5f5;
    }

    .navbar {
      background-color: #00d1b2;
    }

    .webcam-image {
      margin-bottom: 20px;
    }

    .footer {
      text-align: center;
      padding: 20px;
      background-color: #00d1b2;
      color: white;
    }
    .container {
        max-width:100% !important;
    }
  </style>
  <script>
    const configs = {
      northlake: {
        links: {
          "Wunderground": "https://www.wunderground.com/hourly/us/ca/soda-springs/KCASODAS17",
          "Open Snow": "https://opensnow.com/dailysnow/tahoe",
          "Sugarbowl": "https://www.sugarbowl.com/conditions",
          "Caltrans 80": "https://roads.dot.ca.gov/?roadnumber=80",
        },
        webcam_urls: [
          "https://cwwp2-ssl.dot.ca.gov/data/d3/cctv/image/hwy80atwhitmoregrade/hwy80atwhitmoregrade.jpg",
          "https://cwwp2-ssl.dot.ca.gov/data/d3/cctv/image/hwy80atkingvalewb/hwy80atkingvalewb.jpg",
          "https://cwwp2-ssl.dot.ca.gov/data/d3/cctv/image/hwy80atcastlepeak/hwy80atcastlepeak.jpg",
          "https://cwwp2-ssl.dot.ca.gov/data/d3/cctv/image/hwy80atdonnersummit/hwy80atdonnersummit.jpg",
        ],
        tweets: [
          "https://twitter.com/CaltransDist3",
          "https://twitter.com/sugarbowlresort",
          "https://twitter.com/alpine_meadows"
        ]
      },
      southlake: {
        links: {
          "Wunderground": "https://www.wunderground.com/hourly/us/ca/twin-bridges/KCATWINB8",
          "Open Snow": "https://opensnow.com/dailysnow/tahoe",
          "Sierra Report": "https://www.sierraattahoe.com/weather-snow-report/",
          "Sciots Webcam": "http://sciotscamp.org/index.php/webcam/",
          "Caltrans 50": "https://roads.dot.ca.gov/?roadnumber=50"
        },
        webcam_urls: [
          "https://cwwp2.dot.ca.gov/data/d3/cctv/image/hwy50attwinbridges/hwy50attwinbridges.jpg?",
          "https://cwwp2.dot.ca.gov/data/d3/cctv/image/hwy50atechosummit/hwy50atechosummit.jpg?",
          "https://cwwp2.dot.ca.gov/data/d3/cctv/image/hwy50atmeyers/hwy50atmeyers.jpg?",
          "https://dirigo-ftp-sierra-webcams-prod-01.azurewebsites.net/webcam/grandview.jpg?",
          "https://cwwp2.dot.ca.gov/data/d3/cctv/image/hwy50atsierraeb/hwy50atsierraeb.jpg?",
        ],
        tweets: [
          "https://twitter.com/CaltransDist3",
          "https://twitter.com/Sierra_at_Tahoe",
          "https://twitter.com/HVconditions"
        ]
      }
    };

    let currentConfig = 'southlake';

    function renderPage(configKey) {
      const config = configs[configKey];

      // Clear existing content
      $("#links-container").empty();
      $("#webcam-container").empty();
      $("#tweets-container").empty();

      // Update Links
      for (const [title, url] of Object.entries(config.links)) {
        $("#links-container").append(`<a class="navbar-item button is-link is-light mx-1" href="${url}" target="_blank">${title}</a>`);
      }

      // Update Webcams (First Two)
      config.webcam_urls.slice(0, 2).forEach((url, index) => {
        $("#webcam-container").append(`
          <div class="column is-half">
            <figure class="image is-4by3 webcam-image">
              <img src="${url}" alt="Webcam ${index + 1}">
            </figure>
          </div>
        `);
      });

      // Update Tweets with delay
      config.tweets.forEach((tweet, i) => {
        setTimeout(() => {
          $("#tweets-container").append(`
            <div class="column is-one-third">
              <a class="twitter-timeline"
                href="${tweet}"
                data-tweet-limit="5"
                data-chrome="noheader nofooter noborders transparent"
                data-width="300"
                data-height="300">
                Tweets by ${tweet.split('/').pop()}
              </a>
            </div>
          `);
          // Reinitialize Twitter widgets after delay
          if (i === config.tweets.length - 1) {
            setTimeout(() => {
              twttr.widgets.load();
            }, 500);
          }
        }, i * 1000); // Stagger tweets every 1 second
      });

      // Update Remaining Webcams
      config.webcam_urls.slice(2).forEach((url, index) => {
        $("#webcam-container").append(`
          <div class="column is-one-third">
            <figure class="image is-4by3 webcam-image">
              <img src="${url}" alt="Webcam ${index + 3}">
            </figure>
          </div>
        `);
      });
      // Initialize Twitter Widgets
      const script = document.createElement("script");
      script.src = "https://platform.twitter.com/widgets.js";
      script.async = true;
      document.body.appendChild(script);

      // Update Dropdown Label
      $("#current-config").text(configKey.charAt(0).toUpperCase() + configKey.slice(1));
    }

    $(document).ready(function () {
    // Render Initial Config
    renderPage(currentConfig);

    // Button Click Events for Northlake and Southlake
    $("#northlake-btn").click(function () {
        currentConfig = 'northlake';
        renderPage(currentConfig);
    });

    $("#southlake-btn").click(function () {
        currentConfig = 'southlake';
        renderPage(currentConfig);
    });

    // Webcam auto-refresh
    setInterval(() => {
        $("img").each(function () {
        const $img = $(this);
        const src = $img.attr("src").split("?")[0];
        $img.attr("src", `${src}?_ts=${new Date().getTime()}`);
        });
    }, 1000 * 15);
    });

  </script>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar has-background-white" role="navigation" aria-label="main navigation">
    <span id="links-container" class="buttons my-4 has-text-centered">
      <!-- Links will be inserted here dynamically -->
    </span>
    <div class="navbar-end">
        <div class="navbar-item">
            <button id="northlake-btn" class="button is-light mx-1">Northlake</button>
            <button id="southlake-btn" class="button is-light mx-1">Southlake</button>
        </div>
    </div>
  </nav>

  <div class="container">

    <!-- Webcam Section -->
    <div id="webcam-container" class="columns is-multiline">
      <!-- First two webcams will be inserted here dynamically -->
    </div>

    <!-- Twitter Feeds Section -->
    <div id="tweets-container" class="columns is-multiline my-4">
      <!-- Twitter feeds will be inserted here dynamically -->
    </div>
  </div>

</body>

</html>
